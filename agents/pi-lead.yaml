name: pi-lead
version: 0.1.0
runtime:
  type: process
  version: "1"
pi_config:
  model: claude-3-7-sonnet
  temperature: 0.2
  max_tokens: 8192
  plugins:
    - name: team-lead
      enabled: true
      description: Оркестрация команды (delegation, handoff)
  skills:
    - path: skills/lead/plan
      enabled: true
      description: Планирование и декомпозиция задач
  mcp:
    servers: []
resources:
  cpu: "1.0"
  memory: 1G
  gpu: false
startup:
  files:
    - path: system_prompt_lead.md
      orientation: system
  scripts: []
