openapi: 3.0.3
info:
  title: Team Daemon HTTP API
  version: 1.0.0
  description: |
    Публичный HTTP API демона оркестрации мультиагентных команд ("team").
    Stdlib net/http (ADR-001). Auth: API-ключ в заголовке `X-API-Key` (ADR-003);
    WS-аутентификация — `?api_key=` в URL. Ошибки — единый error envelope
    (см. components.schemas.ErrorEnvelope и docs/contracts/error-model.md).
    Источник правды по набору операций: backend/internal/api/http/server.go.
    По контрактам запросов/ответов: docs/architecture/frontend/20_contract_API.md.
  contact:
    name: team
servers:
  - url: http://localhost:8080
    description: Локальный daemon
security:
  - apiKeyAuth: []
tags:
  - name: system
    description: Пробы живости/готовности
  - name: teams
    description: "Team Builder: команды"
  - name: topology
    description: "Team Builder: сегменты/роли/связи/layout"
  - name: tasks
    description: Tasks and History
  - name: dashboard
    description: "Dashboard: сводки, метрики, алерты"
  - name: sessions
    description: Sessions and Runtime
  - name: messages
    description: "Message Center + chatrooms"
  - name: workflows
    description: Workflow Editor
  - name: library
    description: Library templates
  - name: history
    description: Audit log
  - name: config
    description: "Settings: конфигурация демона (U4)"
  - name: websocket
    description: Real-time события

paths:
  # ---- system ----
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      tags: [system]
      security: []
      responses:
        '200':
          description: Сервер жив
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (ping БД)
      tags: [system]
      security: []
      responses:
        '200':
          description: Готов к работе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatusResponse' }
        '503': { $ref: '#/components/responses/InternalError' }

  # ---- teams ----
  /api/v1/teams:
    get:
      operationId: listTeams
      summary: Список команд
      tags: [teams]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Список команд
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamsListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createTeam
      summary: Создать команду (опционально со spec топологии)
      tags: [teams]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeamRequest' }
      responses:
        '201':
          description: Команда создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamCreatedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/teams/{id}:
    get:
      operationId: getTeam
      summary: Детальная информация о команде
      tags: [teams]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Команда (team/segments/roles/relatives)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetTeamResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: archiveTeam
      summary: Архивировать команду (DELETE /teams/{id} = archive)
      tags: [teams]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Команда архивирована
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamCreatedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/teams/{id}/topology:
    get:
      operationId: getTopology
      summary: Топология команды (contract snake_case + layout)
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Топология (team/segments/roles/relatives/layout)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopologyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/teams/{id}/validate:
    post:
      operationId: validateTopology
      summary: Валидация топологии (I1–I4)
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Результат валидации
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateTopologyResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/teams/{id}/save:
    post:
      operationId: saveTopology
      summary: Сохранить (пересобрать) топологию команды
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveTopologyRequest' }
      responses:
        '200':
          description: Топология сохранена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/teams/{id}/segments:
    post:
      operationId: createSegment
      summary: Добавить сегмент в команду
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSegmentRequest' }
      responses:
        '201':
          description: Сегмент создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSegmentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/teams/{id}/relatives:
    post:
      operationId: createRelative
      summary: Создать связь (relative) между ролями
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRelativeRequest' }
      responses:
        '201':
          description: Связь создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRelativeResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---- topology: segments / roles / relatives ----
  /api/v1/segments/{id}:
    patch:
      operationId: updateSegmentMeta
      summary: Переименовать сегмент (name/description) — U3-rename
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameRequest' }
      responses:
        '200':
          description: Сегмент переименован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenameResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/segments/{id}/roles:
    post:
      operationId: createRole
      summary: "Добавить роль в сегмент (I4: agent_spec обязан существовать)"
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '201':
          description: Роль создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRoleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/segments/{id}/layout:
    patch:
      operationId: updateSegmentLayout
      summary: Обновить layout сегмента (drag & drop)
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutPatchRequest' }
      responses:
        '200':
          description: Layout обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutPatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/roles/{id}/config:
    get:
      operationId: getRoleConfig
      summary: Конфигурация роли (agent_spec + профили/скиллы/плагины)
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Конфигурация роли
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleConfigResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateRoleConfig
      summary: Обновить конфигурацию роли
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleConfigRequest' }
      responses:
        '200':
          description: Конфигурация обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UpdateRoleConfigResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/roles/{id}/layout:
    patch:
      operationId: updateRoleLayout
      summary: Обновить layout роли (drag & drop)
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutPatchRequest' }
      responses:
        '200':
          description: Layout обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutPatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/relatives/{id}/layout:
    patch:
      operationId: updateRelativeLayout
      summary: Обновить layout связи
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LayoutPatchRequest' }
      responses:
        '200':
          description: Layout обновлён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayoutPatchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/relatives/{id}:
    delete:
      operationId: deleteRelative
      summary: Удалить связь
      tags: [topology]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Связь удалена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---- tasks ----
  /api/v1/tasks:
    get:
      operationId: listTasks
      summary: Список задач
      tags: [tasks]
      parameters:
        - { $ref: '#/components/parameters/TeamIdQuery' }
        - { $ref: '#/components/parameters/State' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TasksListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createTask
      summary: Создать задачу
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Задача создана (state=pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskCreatedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/overdue:
    get:
      operationId: listTasksOverdue
      summary: Просроченные задачи (in_progress/blocked + closure_required_at < now)
      description: |
        P0.2: bounded-срез просроченных задач (дедлайн закрытия прошёл).
        RBAC: dashboard.read (operator view, viewer-доступен). Сортировка: самое
        просроченное (ранний дедлайн) — сверху. total = полное число просроченных.
      tags: [tasks]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: Просроченные задачи (items с is_overdue + remaining_secs)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TasksListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      summary: Задача + подзадачи
      tags: [tasks]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Задача (task + subtasks)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetTaskResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}/state:
    patch:
      operationId: updateTaskState
      summary: Сменить состояние задачи (closure_reason обязателен для done)
      tags: [tasks]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskStateRequest' }
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}/handoff:
    post:
      operationId: handoffTask
      summary: Handoff задачи другой роли (исходная → done)
      tags: [tasks]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffTaskRequest' }
      responses:
        '201':
          description: Handoff выполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffTaskResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/tasks/{id}/history:
    get:
      operationId: getTaskHistory
      summary: История задачи
      tags: [tasks]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: История задачи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---- dashboard ----
  /api/v1/dashboard/summary:
    get:
      operationId: dashboardSummary
      summary: Сводка по командам/задачам/сессиям/алертам
      tags: [dashboard]
      responses:
        '200':
          description: Сводка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummaryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/dashboard/tasks:
    get:
      operationId: dashboardTasks
      summary: Активные задачи (для дашборда)
      tags: [dashboard]
      responses:
        '200':
          description: Задачи
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TasksListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/dashboard/sessions:
    get:
      operationId: dashboardSessions
      summary: Активные сессии (для дашборда)
      tags: [dashboard]
      responses:
        '200':
          description: Сессии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionsListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/dashboard/alerts:
    get:
      operationId: dashboardAlerts
      summary: Алерты watchdog (для дашборда)
      tags: [dashboard]
      responses:
        '200':
          description: Алерты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/dashboard/metrics:
    get:
      operationId: dashboardMetrics
      summary: Метрики для графиков (time series)
      tags: [dashboard]
      parameters:
        - { $ref: '#/components/parameters/Range' }
      responses:
        '200':
          description: Метрики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---- sessions ----
  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: Все сессии (фильтры team_id/role_id/state)
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/TeamIdQuery' }
