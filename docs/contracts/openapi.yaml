        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteWatchdogJob
      summary: Удалить дjob (только если ещё не fired; с историей → 409)
      description: >
        P1.6. Удаление джоба. Если fired_count > 0 (есть история) — 409 (удалить
        нельзя, только остановить). operator+ (watchdog.update).
      tags: [watchdogJobs]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Key' }
      responses:
        '200':
          description: Джоб удалён
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/watchdog/jobs/{id}/stop:
    post:
      operationId: stopWatchdogJob
      summary: Остановить дjob (enabled=false; история сохраняется)
      description: >
        P1.6. Остановка джоба (enabled=false). История не трогается. operator+
        (watchdog.update).
      tags: [watchdogJobs]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Key' }
      responses:
        '200':
          description: Джоб остановлен (enabled=false)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchdogJobView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        API-ключ (ADR-003). Env-ключ = admin; DB-ключ — user + роль (RBAC).
        WS: заголовок не шлётся браузером — используется query ?api_key=.

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Идентификатор ресурса
      schema: { type: integer, format: int64 }
    BlockId:
      name: blockId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Iid:
      name: iid
      in: path
      required: true
      description: Идентификатор workflow instance (P1.4)
      schema: { type: integer, format: int64 }
    Key:
      name: key
      in: path
      required: true
      description: Канонический ключ конфигурации (section.key)
      schema: { type: string, example: server.listen_addr }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer }
    Offset:
      name: offset
      in: query
      required: false
      schema: { type: integer }
    TeamIdQuery:
      name: team_id
      in: query
      required: false
      schema: { type: integer }
    RoleidQuery:
      name: role_id
      in: query
      required: false
      schema: { type: integer }
    State:
      name: state
      in: query
      required: false
      schema: { type: string }
    Range:
      name: range
      in: query
      required: false
      schema: { type: string, enum: [1h, 24h, 7d], default: 24h }

  responses:
    BadRequest:
      description: "Невалидный request (code: validation_failed)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: "Нет/неверный API-ключ (code: unauthorized)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: "Нет прав (code: forbidden)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: "Ресурс/parent не существует (code: not_found)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: "Нарушение unique (code: conflict)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    InternalError:
      description: "Ошибка сервера (code: internal)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  schemas:
    # ---- error envelope (docs/contracts/error-model.md) ----
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [validation_failed, unauthorized, forbidden, not_found, conflict, internal]
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    # ---- system / generic ----
    StatusResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    SavedResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: saved }

    # ---- teams ----
    Team:
      type: object
      required: [id, name, state, segments_count, roles_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        state: { type: string, enum: [active, archived, stopped] }
        segments_count: { type: integer }
        roles_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TeamsListResponse:
      type: object
      required: [teams, total]
      properties:
        teams:
          type: array
          items: { $ref: '#/components/schemas/Team' }
        total: { type: integer }
    Position:
      type: object
      properties:
        x: { type: integer }
        y: { type: integer }
        width: { type: integer }
        height: { type: integer }
    SegmentSpec:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        config: { type: object, additionalProperties: true }
        layout: { $ref: '#/components/schemas/Position' }
    RoleSpec:
      type: object
      required: [name, agent_spec]
      properties:
        name: { type: string }
        agent_spec: { type: string }
        segment: { type: string, description: "Имя сегмента (top-level roles в TeamSpec)" }
        profile: { type: string }
        config: { type: object, additionalProperties: true }
        layout: { $ref: '#/components/schemas/Position' }
    RelativeSpec:
      type: object
      required: [from, to, type]
      properties:
        from: { type: string, description: "Адрес формата Segment.Role" }
        to: { type: string }
        type: { type: string, enum: [delegates_to, spawned_by, can_observe, collaborates_with] }
        config: { type: object, additionalProperties: true }
    TeamSpec:
      type: object
      properties:
        segments:
          type: array
          items: { $ref: '#/components/schemas/SegmentSpec' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleSpec' }
        relatives:
          type: array
          items: { $ref: '#/components/schemas/RelativeSpec' }
    CreateTeamRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        spec: { $ref: '#/components/schemas/TeamSpec' }
    TeamCreatedResponse:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string, enum: [created, archived] }
    Segment:
      type: object
      required: [id, team_id, name, roles_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        config: { type: object, additionalProperties: true }
        roles_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleSession:
      type: object
      required: [id, state]
      properties:
        id: { type: integer, format: int64 }
        state: { type: string, enum: [running, stopped, failed] }
        started_at: { type: string, format: date-time }
    Role:
      type: object
      required: [id, team_id, segment_id, segment_name, name, address, agent_spec, state, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        segment_id: { type: integer, format: int64 }
        segment_name: { type: string }
        name: { type: string }
        address: { type: string }
        agent_spec: { type: string }
        profile: { type: string }
        state: { type: string, enum: [active, inactive, blocked] }
        session: { $ref: '#/components/schemas/RoleSession' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Relative:
      type: object
      required: [id, team_id, from_role_id, from_role_name, to_role_id, to_role_name, type, created_at]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        from_role_id: { type: integer, format: int64 }
        from_role_name: { type: string }
        to_role_id: { type: integer, format: int64 }
        to_role_name: { type: string }
        type: { type: string }
        config: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    GetTeamResponse:
      type: object
      required: [team, segments, roles, relatives]
      properties:
        team: { $ref: '#/components/schemas/Team' }
        segments:
          type: array
          items: { $ref: '#/components/schemas/Segment' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        relatives:
          type: array
          items: { $ref: '#/components/schemas/Relative' }
    Layout:
      type: object
      additionalProperties: true
      description: Layout segments/roles/relatives (positions, width/height)
    TopologyResponse:
      type: object
      required: [team, segments, roles, relatives]
      properties:
        team: { $ref: '#/components/schemas/Team' }
        segments:
          type: array
          items: { $ref: '#/components/schemas/Segment' }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        relatives:
          type: array
          items: { $ref: '#/components/schemas/Relative' }
        layout: { $ref: '#/components/schemas/Layout' }
    ValidateTopologyResponse:
      type: object
      required: [is_valid]
      properties:
        is_valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    SaveTopologyRequest:
      type: object
      properties:
        spec: { $ref: '#/components/schemas/TeamSpec' }
    CreateSegmentRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        config: { type: object, additionalProperties: true }
    CreateSegmentResponse:
      type: object
      required: [id, team_id, name, status]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        name: { type: string }
        layout: { $ref: '#/components/schemas/Position' }
        status: { type: string, enum: [created] }
    CreateRoleRequest:
      type: object
      required: [name, agent_spec]
      properties:
        name: { type: string }
        agent_spec: { type: string }
        profile: { type: string }
        config: { type: object, additionalProperties: true }
    CreateRoleResponse:
      type: object
      required: [id, segment_id, name, address, status]
      properties:
        id: { type: integer, format: int64 }
        segment_id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        layout: { $ref: '#/components/schemas/Position' }
        status: { type: string, enum: [created] }
    CreateRelativeRequest:
      type: object
      required: [from_role_id, to_role_id, type]
      properties:
        from_role_id: { type: integer, format: int64 }
        to_role_id: { type: integer, format: int64 }
        type: { type: string }
        config: { type: object, additionalProperties: true }
    CreateRelativeResponse:
      type: object
      required: [id, from_role_name, to_role_name, type, status]
      properties:
        id: { type: integer, format: int64 }
        from_role_name: { type: string }
        to_role_name: { type: string }
        type: { type: string }
        status: { type: string, enum: [created] }
    LayoutPatchRequest:
      type: object
      properties:
        layout: { $ref: '#/components/schemas/Position' }
    LayoutPatchResponse:
      type: object
      additionalProperties: true
      description: previous_layout / new_layout
    RenameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    RenameResponse:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [updated] }
    RoleConfig:
      type: object
      additionalProperties: true
      description: Распарсенный agent_spec (name, version, runtime, pi_config, resources, startup)
    RoleConfigResponse:
      type: object
      required: [role, agent_spec]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        agent_spec: { $ref: '#/components/schemas/RoleConfig' }
        profiles:
          type: array
          items: { type: object, additionalProperties: true }
    UpdateRoleConfigRequest:
      type: object
      properties:
        agent_spec: { type: string }
        profile: { type: string }
        config: { type: object, additionalProperties: true }
    UpdateRoleConfigResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [updated] }
        previous_config: { type: object, additionalProperties: true }
        new_config: { type: object, additionalProperties: true }

    # ---- tasks ----
    Task:
      type: object
      required: [id, team_id, team_name, title, state, priority, destination_role_id, destination_role_name, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        team_name: { type: string }
        title: { type: string }
        state: { type: string, enum: [pending, in_progress, blocked, done, canceled] }
        priority: { type: integer }
        destination_role_id: { type: integer, format: int64 }
        destination_role_name: { type: string }
        source_role_id: { type: integer, format: int64 }
        source_role_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        progress: { type: number }
        is_stale: { type: boolean }
        is_blocked: { type: boolean }
        is_overdue: { type: boolean, description: "P0.2: in_progress/blocked и closure_required_at < now" }
        closure_required_at: { type: string, format: date-time, description: "P0.2: дедлайн закрытия (выставляется в in_progress)" }
        remaining_secs: { type: integer, format: int64, description: "P0.2: closure_required_at - now (отриц. = просрочено)" }
    TasksListResponse:
      type: object
      required: [tasks, total]
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        total: { type: integer }
    CreateTaskRequest:
      type: object
      required: [team_id, destination_role_id, title]
      properties:
        team_id: { type: integer, format: int64 }
        parent_task_id: { type: integer, format: int64 }
        destination_role_id: { type: integer, format: int64 }
        source_role_id: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string }
        body_context: { type: object, additionalProperties: true }
        priority: { type: integer }
    TaskCreatedResponse:
      type: object
      required: [id, state, status]
      properties:
        id: { type: integer, format: int64 }
        state: { type: string, enum: [pending] }
        status: { type: string, enum: [created] }
    GetTaskResponse:
      type: object
      required: [task, subtasks]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        subtasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        wake: { $ref: '#/components/schemas/TaskWake' }  # P0.3: current/most-recent wake
    UpdateTaskStateRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [pending, in_progress, blocked, done, canceled] }
        closure_reason: { type: string, enum: [handed_off_to, blocked_on, denied, canceled, no_follow_on, escalation] }
        closure_target_id: { type: integer, format: int64 }
        comment: { type: string }
        wake: { $ref: '#/components/schemas/TaskWakeSpec' }  # P0.3: при blocked (опционально)
    TaskWake:
      type: object
      required: [kind, fired]
      properties:
        kind: { type: string, enum: [timer, task] }
        ref: { type: string, description: "kind=task: task_id; kind=timer: fire-at (RFC3339)" }
        continuation: { type: string, description: "«как продолжить»" }
        fired: { type: boolean, description: "закрыт (fired ИЛИ resolve)" }
        fired_at: { type: string, format: date-time }
        remaining_secs: { type: integer, format: int64, description: "timer only: fire_at - now (neg = fired)" }
    TaskWakeSpec:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [timer, task] }
        after: { type: string, description: "timer: duration, e.g. 30m" }
        task_id: { type: integer, format: int64, description: "task: referenced task_id" }
        continuation: { type: string, description: "«как продолжить»" }
    HandoffTaskRequest:
      type: object
      required: [to_role_id]
      properties:
        to_role_id: { type: integer, format: int64 }
        comment: { type: string }
    HandoffTaskResponse:
      type: object
      required: [new_task_id, closed_task_id, status]
      properties:
        new_task_id: { type: integer, format: int64 }
        closed_task_id: { type: integer, format: int64 }
        task: { $ref: '#/components/schemas/Task' }
        status: { type: string, enum: [handed_off] }
    TaskHistoryEntry:
      type: object
      required: [id, queue_task_id, to_state, actor_type, created_at]
      properties:
        id: { type: integer, format: int64 }
        queue_task_id: { type: integer, format: int64 }
        from_state: { type: string }
        to_state: { type: string }
        closure_reason: { type: string }
        closure_target_id: { type: integer, format: int64 }
        closure_target_title: { type: string }
        actor_type: { type: string }
        actor_role_id: { type: integer, format: int64 }
        actor_role_name: { type: string }
        actor_session_id: { type: integer, format: int64 }
        comment: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    TaskHistoryResponse:
      type: object
      required: [history, total]
      properties:
        history:
          type: array
          items: { $ref: '#/components/schemas/TaskHistoryEntry' }
        total: { type: integer }

    # ---- dashboard ----
    DashboardSummaryResponse:
      type: object
      required: [teams, tasks, sessions, alerts, updated_at]
      properties:
        teams:
          type: object
          properties:
            total: { type: integer }
            active: { type: integer }
        tasks:
          type: object
          properties:
            total: { type: integer }
            pending: { type: integer }
            in_progress: { type: integer }
            blocked: { type: integer }
            done_today: { type: integer }
        sessions:
          type: object
          properties:
            total: { type: integer }
            running: { type: integer }
            failed: { type: integer }
        alerts:
          type: object
          properties:
            total: { type: integer }
            critical: { type: integer }
            warning: { type: integer }
        updated_at: { type: string, format: date-time }
    TimeSeriesPoint:
      type: object
      required: [timestamp, value]
      properties:
        timestamp: { type: string, format: date-time }
        value: { type: number }
    MetricsResponse:
      type: object
      required: [time_range, metrics]
      properties:
        time_range:
          type: object
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        metrics:
          type: object
          properties:
            tasks_created:
              type: array
              items: { $ref: '#/components/schemas/TimeSeriesPoint' }
            tasks_completed:
              type: array
              items: { $ref: '#/components/schemas/TimeSeriesPoint' }
            sessions_active:
              type: array
              items: { $ref: '#/components/schemas/TimeSeriesPoint' }
            queue_size:
              type: array
              items: { $ref: '#/components/schemas/TimeSeriesPoint' }
            llm_tokens:
              type: array
              items: { $ref: '#/components/schemas/TimeSeriesPoint' }

    # ---- sessions ----
    Session:
      type: object
      required: [id, team_id, team_name, role_id, role_name, runtime_type, state]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        team_name: { type: string }
        role_id: { type: integer, format: int64 }
        role_name: { type: string }
        runtime_type: { type: string, enum: [container, process, tmux, pi] }
        state: { type: string }
        queue_task_id: { type: integer, format: int64 }
        queue_task_title: { type: string }
        started_at: { type: string, format: date-time }
        uptime_seconds: { type: number }
        cpu_percent: { type: number }
        memory_bytes: { type: integer, format: int64 }
        briefing_applied: { type: string, description: "P1.7: builtin | override | none (если пуст — без брифинга)" }
        briefing_path: { type: string, description: "P1.7: путь к briefing-файлу (process/tmux)" }
    SessionDetail:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          properties:
            runtime_ref: { type: string }
            command: { type: string }
            exit_code: { type: integer }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
            model: { type: string }
            context_used_percentage: { type: number }
            context_total_input_tokens: { type: integer, format: int64 }
            context_total_output_tokens: { type: integer, format: int64 }
            log_path: { type: string }
            briefing_text: { type: string, description: "P1.7: полный текст брифинга (detail)" }
    SessionsListResponse:
      type: object
      required: [sessions, total]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionDetail' }
        total: { type: integer }
    CreateSessionRequest:
      type: object
      required: [role_id]
      properties:
        role_id: { type: integer, format: int64 }
        queue_task_id: { type: integer, format: int64 }
        runtime_type: { type: string }
        command: { type: string }
        args:
          type: array
          items: { type: string }
        working_dir: { type: string }
        config: { type: object, additionalProperties: true }
    CreateSessionResponse:
      type: object
      required: [id, state, status]
      properties:
        id: { type: integer, format: int64 }
        state: { type: string }
        status: { type: string, enum: [started] }
        briefing_applied: { type: string, description: "P1.7: builtin | override | none (пусто = без брифинга)" }
        briefing_path: { type: string, description: "P1.7: путь к briefing-файлу (process/tmux)" }
    StopSessionResponse:
      type: object
      required: [id, state, status]
      properties:
        id: { type: integer, format: int64 }
        state: { type: string, enum: [stopped] }
        status: { type: string, enum: [stopped] }
    # ---- P1.5: session handover + compact-plan ----
    HandoverRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: Причинa handover (обязательная, попадает в комментарий) }
        target_working_dir: { type: string, description: Опц. рабочая директория наследника (по умолчанию как у предшественника) }
        dry_run: { type: boolean, description: true — только план, без мутаций }
    HandoverStep:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, failed, skipped, would] }
        reason: { type: string }
        detail: { type: string }
    HandoverTaskRef:
      type: object
      required: [id, title, state]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        state: { type: string }
        new_id: { type: integer, format: int64, description: Новая задача (после handoff) }
    HandoverContextPackage:
      type: object
      required: [context_file, lines]
      properties:
        context_file: { type: string }
        transcript_path: { type: string }
        lines: { type: integer }
        task: { $ref: '#/components/schemas/HandoverTaskRef' }
    HandoverPreview:
      type: object
      required: [role_id, role_name, team_id, team_name, runtime_type, working_dir]
      properties:
        role_id: { type: integer, format: int64 }
        role_name: { type: string }
        team_id: { type: integer, format: int64 }
        team_name: { type: string }
        runtime_type: { type: string }
        working_dir: { type: string }
        handoff_comment: { type: string }
    HandoverResult:
      type: object
      required: [status, dry_run, old_session_id, context_prepared, successor_started, task_reassigned, old_stopped]
      properties:
        status: { type: string, enum: [succeeded, partial, failed, planned] }
        dry_run: { type: boolean }
        old_session_id: { type: integer, format: int64 }
        new_session_id: { type: integer, format: int64 }
        context_prepared: { $ref: '#/components/schemas/HandoverStep' }
        successor_started: { $ref: '#/components/schemas/HandoverStep' }
        task_reassigned: { $ref: '#/components/schemas/HandoverStep' }
        old_stopped: { $ref: '#/components/schemas/HandoverStep' }
        context_package: { $ref: '#/components/schemas/HandoverContextPackage' }
        successor_preview: { $ref: '#/components/schemas/HandoverPreview' }
    CompactPlanEntry:
      type: object
      required: [session_id, team_id, team_name, role_id, role_name, runtime_type, state, suggested_action]
      properties:
        session_id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        team_name: { type: string }
        role_id: { type: integer, format: int64 }
        role_name: { type: string }
        runtime_type: { type: string }
        state: { type: string }
        model: { type: string }
        working_dir: { type: string }
        queue_task_id: { type: integer, format: int64 }
        context_used_percentage: { type: number }
        suggested_action: { type: string, enum: [handover, wait_for_turn] }
    CompactPlanResponse:
      type: object
      required: [sessions, total, wall_pct]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/CompactPlanEntry' }
        total: { type: integer }
        wall_pct: { type: integer }
    WatchdogJobView:
      type: object
      required: [id, name, policy, target_session_id, threshold_pct, enabled, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        policy: { type: string, enum: [context-usage-threshold] }
        target_session_id: { type: integer, format: int64 }
        threshold_pct: { type: number }
        message: { type: string }
        enabled: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        fired_count: { type: integer, format: int64 }
        last_fired_at: { type: string, format: date-time }
        last_fired_pct: { type: number }
    WatchdogJobEvent:
      type: object
      required: [id, job_id, outcome, created_at]
      properties:
        id: { type: integer, format: int64 }
        job_id: { type: integer, format: int64 }
        outcome: { type: string, enum: [fired, quiet, dead-target, stopped] }
        detail: { type: string }
        pct: { type: number }
        created_at: { type: string, format: date-time }
    WatchdogJobDetail:
      type: object
      required: [job, recent_evaluations]
      properties:
        job: { $ref: '#/components/schemas/WatchdogJobView' }
        recent_evaluations:
          type: array
          items: { $ref: '#/components/schemas/WatchdogJobEvent' }
    WatchdogJobRegisterRequest:
      type: object
      required: [name, target_session_id, threshold_pct]
      properties:
        name: { type: string, maxLength: 200 }
        target_session_id: { type: integer, format: int64 }
        threshold_pct: { type: number, minimum: 1, maximum: 100 }
        message: { type: string, maxLength: 500 }
    WatchdogJobListResponse:
      type: object
      required: [jobs, total]
      properties:
        jobs:
          type: array
          items: { $ref: '#/components/schemas/WatchdogJobView' }
        total: { type: integer }
    # P1.7 — Session briefing
    BriefingPreviewRequest:
      type: object
      required: [role_id]
      properties:
        role_id: { type: integer, format: int64 }
        queue_task_id: { type: integer, format: int64 }
        override: { type: string }
        append: { type: string }
        runtime_type: { type: string, enum: [pi, tmux, process] }
        working_dir: { type: string }
        project_id: { type: integer, format: int64 }
    BriefingTask:
      type: object
      required: [id, title, state]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        state: { type: string }
        body: { type: string }
        parent_id: { type: integer, format: int64 }
        project: { type: string }
        recent:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              text: { type: string }
              at: { type: string, format: date-time }
    BriefingTeam:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
        neighbors:
          type: array
          items: { type: string }
    BriefingGit:
      type: object
      required: [branch, head]
      properties:
        branch: { type: string }
        head: { type: string }
        commits:
          type: array
          items: { type: string }
    BriefingProject:
      type: object
      required: [name, path, open_tasks]
      properties:
        name: { type: string }
        path: { type: string }
        git: { $ref: '#/components/schemas/BriefingGit' }
        open_tasks: { type: integer }
        active_tasks:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              title: { type: string }
              state: { type: string }
              priority: { type: integer }
    BriefingData:
      type: object
      properties:
        task: { $ref: '#/components/schemas/BriefingTask' }
        team: { $ref: '#/components/schemas/BriefingTeam' }
        project: { $ref: '#/components/schemas/BriefingProject' }
        messages:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [direct, chatroom] }
              from: { type: string }
              body: { type: string }
              at: { type: string, format: date-time }
        alerts:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              description: { type: string }
              age_secs: { type: integer, format: int64 }
    BriefingDelivery:
      type: object
      required: [mode, detail]
      properties:
        mode: { type: string, enum: [pi-system-prompt, file-env] }
        detail: { type: string }
    BriefingPreviewResponse:
      type: object
      required: [briefing_text, briefing_data, briefing_applied, delivery]
      properties:
        briefing_text: { type: string }
        briefing_data: { $ref: '#/components/schemas/BriefingData' }
        briefing_applied: { type: string, enum: [builtin, override, none] }
        delivery: { $ref: '#/components/schemas/BriefingDelivery' }
    # P1.8 — Health/Doctor-панель
    CheckResult:
      type: object
      required: [name, status, detail]
      properties:
        name: { type: string }
        status: { type: string, enum: [ok, warn, fail] }
        detail: { type: string }
        evidence: { type: object, additionalProperties: true }
    DiagnosticsResult:
      type: object
      required: [generated_at, overall, checks]
      properties:
        generated_at: { type: string, format: date-time }
        overall: { type: string, enum: [ok, warn, fail] }
        checks:
          type: array
          items: { $ref: '#/components/schemas/CheckResult' }
    SessionHistoryEntry:
      type: object
      required: [id, session_id, to_state, actor_type, created_at]
      properties:
        id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64 }
        from_state: { type: string }
        to_state: { type: string }
        actor_type: { type: string }
        actor_role_name: { type: string }
        comment: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    SessionHistoryResponse:
      type: object
      required: [history, total]
      properties:
        history:
          type: array
          items: { $ref: '#/components/schemas/SessionHistoryEntry' }
        total: { type: integer }
    TranscriptEntry:
      type: object
      required: [id, session_id, message_type, content, created_at]
      properties:
        id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64 }
        message_type: { type: string }
        content: { type: string }
        metadata: { type: object, additionalProperties: true }
        created_at: { type: string, format: date-time }
    TranscriptResponse:
      type: object
      required: [transcript, total, has_more]
      properties:
        transcript:
          type: array
          items: { $ref: '#/components/schemas/TranscriptEntry' }
        total: { type: integer }
        has_more: { type: boolean }

    # ---- P2.7: поиск по транскриптам ----
    TranscriptMatch:
      type: object
      required: [session_id, role_name, team_name, state, line_number, match_line, context, snippet]
      properties:
        session_id: { type: integer, format: int64 }
        role_name: { type: string }
        team_name: { type: string }
        state: { type: string }
        line_number: { type: integer, description: '1-based: первичное совпадение в окне' }
        match_line: { type: string }
        context:
          type: array
          items: { type: string }
        snippet: { type: string }
    TranscriptSearchResponse:
      type: object
      required: [results, total, has_more]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/TranscriptMatch' }
        total: { type: integer }
        has_more: { type: boolean }
    CaptureResponse:
      type: object
      required: [session_id, runtime_type, lines, captured_at, source, saved_path]
      properties:
        session_id: { type: integer, format: int64 }
        runtime_type: { type: string, description: 'pi | tmux | process' }
        lines:
          type: array
          items: { type: string }
          description: Последние N строк экрана (tmux) / лога (process)
        captured_at: { type: string, description: RFC3339Nano }
        source: { type: string, enum: [tmux-pane, log-tail] }
        saved_path: { type: string, description: Путь к сохранённому снапшоту }

    # ---- alerts / watchdog ----
    WatchdogAlert:
      type: object
      required: [id, team_id, team_name, event_type, severity, description, created_at, is_read, requires_action]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        team_name: { type: string }
        event_type: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        description: { type: string }
        queue_task_id: { type: integer, format: int64 }
        session_id: { type: integer, format: int64 }
        role_id: { type: integer, format: int64 }
        action_taken: { type: string }
        created_at: { type: string, format: date-time }
        is_read: { type: boolean }
        requires_action: { type: boolean }
    AlertsResponse:
      type: object
      required: [alerts, total]
      properties:
        alerts:
          type: array
          items: { $ref: '#/components/schemas/WatchdogAlert' }
        total: { type: integer }

    # ---- messages / chatrooms ----
    Message:
      type: object
      required: [id, team_id, type, body, is_read, created_at]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        queue_task_id: { type: integer, format: int64 }
        from_role_id: { type: integer, format: int64 }
        from_role_name: { type: string }
        to_role_id: { type: integer, format: int64 }
        to_role_name: { type: string }
        type: { type: string }
        body: { type: string }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
        is_mine: { type: boolean }
        requires_reply: { type: boolean }
    MessagesResponse:
      type: object
      required: [messages, total, has_more]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        total: { type: integer }
        has_more: { type: boolean }
    SendMessageRequest:
      type: object
      required: [team_id, type, body]
      properties:
        team_id: { type: integer, format: int64 }
        queue_task_id: { type: integer, format: int64 }
        to_role_id: { type: integer, format: int64 }
        type: { type: string, enum: [direct, broadcast, segment] }
        body: { type: string }
        metadata: { type: object, additionalProperties: true }
    SendMessageResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [sent] }
        delivered_to:
          type: array
          items: { type: integer, format: int64 }
    Chatroom:
      type: object
      required: [id, team_id, name, unread_count, members_count]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        segment_id: { type: integer, format: int64 }
        name: { type: string }
        topic: { type: string }
        last_message:
          type: object
          properties:
            body: { type: string }
            from_role_name: { type: string }
            created_at: { type: string, format: date-time }
        unread_count: { type: integer }
        members_count: { type: integer }
    ChatroomsResponse:
      type: object
      required: [chatrooms]
      properties:
        chatrooms:
          type: array
          items: { $ref: '#/components/schemas/Chatroom' }
    ChatroomMessage:
      type: object
      required: [id, chatroom_id, body, created_at, is_mine]
      properties:
        id: { type: integer, format: int64 }
        chatroom_id: { type: integer, format: int64 }
        from_role_id: { type: integer, format: int64 }
        from_role_name: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
        is_mine: { type: boolean }
    ChatroomMessagesResponse:
      type: object
      required: [messages, has_more]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/ChatroomMessage' }
        has_more: { type: boolean }
    SendChatroomMessageRequest:
      type: object
      required: [body]
      properties:
        body: { type: string }
    SendChatroomMessageResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [sent] }

    # ---- workflows ----
    Workflow:
      type: object
      required: [id, team_id, name, state, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        team_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        state: { type: string, enum: [draft, active, archived] }
        engine_enabled: { type: boolean, description: 'P1.4: исполняемый воркфлоу' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    WorkflowPosition:
      type: object
      properties:
        x: { type: integer }
        y: { type: integer }
    WorkflowBlock:
      type: object
      required: [id, workflow_id, type, position, config, created_at]
      properties:
        id: { type: integer, format: int64 }
        workflow_id: { type: integer, format: int64 }
        type: { type: string, enum: [task, decision, parallel, loop, agent, manual] }
        position: { $ref: '#/components/schemas/WorkflowPosition' }
        config: { type: object, additionalProperties: true }
        label: { type: string }
        created_at: { type: string, format: date-time }
    WorkflowConnection:
      type: object
      required: [id, workflow_id, from_block_id, to_block_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        workflow_id: { type: integer, format: int64 }
        from_block_id: { type: integer, format: int64 }
        to_block_id: { type: integer, format: int64 }
        condition: { type: string }
        created_at: { type: string, format: date-time }
    WorkflowsListResponse:
      type: object
      required: [workflows, total]
      properties:
        workflows:
          type: array
          items: { $ref: '#/components/schemas/Workflow' }
        total: { type: integer }
    GetWorkflowResponse:
      type: object
      required: [workflow, blocks, connections]
      properties:
        workflow: { $ref: '#/components/schemas/Workflow' }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/WorkflowBlock' }
        connections:
          type: array
          items: { $ref: '#/components/schemas/WorkflowConnection' }
    WorkflowInstance:
      type: object
      required: [id, workflow_id, state, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        workflow_id: { type: integer, format: int64 }
        state: { type: string, enum: [running, waiting, completed, failed, aborted] }
        root_objective: { type: string }
        current_block_id: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    WorkflowStep:
      type: object
      required: [id, block_id, state]
      properties:
        id: { type: integer, format: int64 }
        block_id: { type: integer, format: int64 }
        block_type: { type: string, enum: [task, decision, parallel, loop, agent, manual] }
        block_label: { type: string }
        task_id: { type: integer, format: int64 }
        task_title: { type: string }
        state: { type: string, enum: [pending, active, done, failed, skipped, routed] }
        exit_kind: { type: string, enum: [handoff, waiting, done, failed] }
        actor: { type: integer, format: int64 }
        actor_name: { type: string }
        result_note: { type: string }
        entered_at: { type: string, format: date-time }
        exited_at: { type: string, format: date-time }
    WorkflowInstanceDetail:
      type: object
      required: [instance, steps]
      properties:
        instance: { $ref: '#/components/schemas/WorkflowInstance' }
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStep' }
        active_step_ids:
          type: array
          items: { type: integer, format: int64 }
    RunWorkflowRequest:
      type: object
      properties:
        root_objective: { type: string }
    RouteInstanceRequest:
      type: object
      required: [to_role_id]
      properties:
        to_role_id: { type: integer, format: int64 }
    WorkflowBlockInput:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [task, decision, parallel, loop, agent, manual] }
        position: { $ref: '#/components/schemas/WorkflowPosition' }
        config: { type: object, additionalProperties: true }
        label: { type: string }
    WorkflowConnectionInput:
      type: object
      required: [from_block_id, to_block_id]
      properties:
        from_block_id: { type: integer, format: int64 }
        to_block_id: { type: integer, format: int64 }
        condition: { type: string }
    CreateWorkflowRequest:
      type: object
      required: [team_id, name]
      properties:
        team_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/WorkflowBlockInput' }
        connections:
          type: array
          items: { $ref: '#/components/schemas/WorkflowConnectionInput' }
    WorkflowCreatedResponse:
      type: object
      required: [id, name, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        status: { type: string, enum: [created] }
    WorkflowBlockCreatedResponse:
      type: object
      required: [id, workflow_id, type, status]
      properties:
        id: { type: integer, format: int64 }
        workflow_id: { type: integer, format: int64 }
        type: { type: string }
        status: { type: string, enum: [created] }
    WorkflowConnectionCreatedResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [created] }
    UpdateBlockRequest:
      type: object
      properties:
        position: { $ref: '#/components/schemas/WorkflowPosition' }
        config: { type: object, additionalProperties: true }
        label: { type: string }
    UpdateBlockResponse:
      type: object
      required: [id, status, changes]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [updated] }
        changes: { type: object, additionalProperties: true }
    DeleteWorkflowBlockResponse:
      type: object
      required: [id, status, removed_connections]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [deleted] }
        removed_connections: { type: integer }
    DeleteWorkflowConnectionResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [deleted] }
    DeleteWorkflowResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [deleted] }

    # ---- library ----
    LibraryItem:
      type: object
      required: [id, type, name, version, is_public, downloads_count, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string, enum: [team, workflow, role, segment] }
        name: { type: string }
        description: { type: string }
        group: { type: string }
        version: { type: string }
        author: { type: string }
        is_public: { type: boolean }
        downloads_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        thumbnail: { type: string }
        tags:
          type: array
          items: { type: string }
        rating: { type: number }
    LibraryGroup:
      type: object
      required: [name, items_count]
      properties:
        name: { type: string }
        items_count: { type: integer }
        icon: { type: string }
    LibraryResponse:
      type: object
      required: [items, total, groups]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LibraryItem' }
        total: { type: integer }
        groups:
          type: array
          items: { $ref: '#/components/schemas/LibraryGroup' }
    SaveToLibraryRequest:
      type: object
      required: [type, source_id, name]
      properties:
        type: { type: string, enum: [team, workflow, role, segment] }
        source_id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        group: { type: string }
        is_public: { type: boolean }
        tags:
          type: array
          items: { type: string }
    SaveToLibraryResponse:
      type: object
      required: [id, status, library_item_id]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [saved] }
        library_item_id: { type: integer, format: int64 }
    LibraryVersion:
      type: object
      required: [version, created_at]
      properties:
        version: { type: string }
        created_at: { type: string, format: date-time }
        changes: { type: string }
        author: { type: string }
    GetLibraryItemResponse:
      type: object
      required: [item, spec, versions]
      properties:
        item: { $ref: '#/components/schemas/LibraryItem' }
        spec: { type: object, additionalProperties: true }
        versions:
          type: array
          items: { $ref: '#/components/schemas/LibraryVersion' }
    ApplyLibraryItemRequest:
      type: object
      properties:
        target_team_id: { type: integer, format: int64 }
        overrides: { type: object, additionalProperties: true }
    ApplyLibraryItemResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [applied, merged] }
        created_resources:
          type: object
          properties:
            teams:
              type: array
              items: { type: integer, format: int64 }
            segments:
              type: array
              items: { type: integer, format: int64 }
            roles:
              type: array
              items: { type: integer, format: int64 }
        updated_resources: { type: object, additionalProperties: true }

    # ---- audit ----
    AuditEntry:
      type: object
      required: [id, timestamp, action]
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        user_id: { type: integer, format: int64 }
        user_name: { type: string }
        api_key_id: { type: integer, format: int64 }
        action: { type: string }
        resource: { type: string }
        details: { type: object, additionalProperties: true }
        ip_address: { type: string }
        user_agent: { type: string }
        icon: { type: string }
        severity: { type: string, enum: [info, warning, error] }
    AuditResponse:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEntry' }
        total: { type: integer }

    # ---- U4: config (Settings) ----
    ConfigKey:
      type: object
      required: [key, section, type, current_value, default_value, source, default_is_derived, requires_restart, editable]
      properties:
        key: { type: string, example: server.listen_addr }
        section:
          type: string
          enum: [server, storage, sessions, watchdog, security, logging, workspace]
        type:
          type: string
          enum: [string, integer, duration, boolean, path, string-list]
        description: { type: string }
        current_value: {} # any: str/num/bool/[] — решённое значение (верхний слой)
        default_value: {} # any: дефолт (derived — host-derived, напр. cwd)
        source:
          type: string
          enum: [default, file, env, override]
        source_detail: { type: string, description: "Имя env-переменной / путь к файлу / \"\"" }
        default_is_derived: { type: boolean, description: "Дефолт host-derived (cwd/машина), не константа" }
        requires_restart: { type: boolean }
        editable: { type: boolean, description: "false — secret/constant (PUT → 403)" }
    ConfigSection:
      type: object
      required: [name, keys]
      properties:
        name: { type: string }
        description: { type: string }
        keys:
          type: array
          items: { $ref: '#/components/schemas/ConfigKey' }
    ConfigMeta:
      type: object
      required: [project, instance, version, uptime_seconds, config_hash, started_at]
      properties:
        project: { type: string, example: team }
        instance: { type: string, example: local }
        version: { type: string, example: "1.0.0" }
        uptime_seconds: { type: integer, format: int64 }
        git_commit: { type: string }
        git_branch: { type: string }
        config_hash: { type: string, example: "sha256:…", description: sha256 над отсортированным JSON эффективных значений всех ключей }
        started_at: { type: string, format: date-time }
    ConfigEnvVar:
      type: object
      required: [env_var, value, feeds_key, source_active]
      properties:
        env_var: { type: string, example: DAEMON_LOG_LEVEL }
        value: { type: string, description: "Значение (secret — маскируется: sk-…/***)" }
        feeds_key: { type: string, example: logging.level }
        source_active: { type: boolean, description: env — победивший слой для этого ключа }
    ListAttentionResponse:
      type: object
      required: [total, items]
      properties:
        total: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/AttentionItem' }
    AttentionItem:
      type: object
      required: [kind, id, severity, title, detail, created_at, suggested_action, link]
      properties:
        kind: { type: string, enum: [task_blocked, task_escalated, alert_unread, workflow_attention, session_failed] }
        id: { type: string }
        severity: { type: string, enum: [critical, high, normal] }
        title: { type: string }
        detail: { type: string }
        created_at: { type: string, format: date-time }
        suggested_action: { type: string }
        link: { $ref: '#/components/schemas/AttentionLink' }
    AttentionLink:
      type: object
      required: [path, label]
      properties:
        path: { type: string }
        label: { type: string }
    ListConfigResponse:
      type: object
      required: [meta, sections]
      properties:
        meta: { $ref: '#/components/schemas/ConfigMeta' }
        sections:
          type: array
          items: { $ref: '#/components/schemas/ConfigSection' }
        environment:
          type: array
          items: { $ref: '#/components/schemas/ConfigEnvVar' }
    Project:
      type: object
      required: [id, name, path, kind, git, archived, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        path: { type: string, description: "Абсолютный путь; immutable после создания" }
        kind: { type: string, enum: [existing, new] }
        git: { type: boolean }
        description: { type: string }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectResponse:
      type: object
      required: [project]
      properties:
        project: { $ref: '#/components/schemas/Project' }
    ListProjectsResponse:
      type: object
      required: [projects, total]
      properties:
        projects:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        total: { type: integer }
    CreateProjectRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [existing, new] }
        path: { type: string, description: "kind=existing: существующий каталог" }
        parent_path: { type: string, description: "kind=new: parent-каталог (создаётся parent/name)" }
        description: { type: string }
    CreateProjectResponse:
      type: object
      required: [project]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        warning: { type: string, description: "напр., git не доступен" }
    ProjectCounts:
      type: object
      required: [teams, tasks, active_sessions]
      properties:
        teams: { type: integer }
        tasks: { type: integer }
        active_sessions: { type: integer }
    GetProjectResponse:
      type: object
      required: [project, counts]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        counts: { $ref: '#/components/schemas/ProjectCounts' }
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        path: { type: string, description: "если задан → 409 (immutable)" }
    SetConfigRequest:
      type: object
      required: [value]
      properties:
        value: {} # any: тип проверяется по type ключа
    SetConfigResponse:
      type: object
      required: [key, value, source, requires_restart, needs_restart]
      properties:
        key: { type: string }
        value: {} # any
        source: { type: string, enum: [override] }
        requires_restart: { type: boolean }
        needs_restart: { type: boolean, description: новое значение отличается от текущего эффективного }
    ResetConfigResponse:
      type: object
      required: [key, source, value]
      properties:
        key: { type: string }
        source:
          type: string
          enum: [default, file, env]
          description: слой, победивший после сброса
        value: {} # any
