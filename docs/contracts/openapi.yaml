    post:
      operationId: runWorkflow
      summary: "Запустить исполняемый workflow (P1.4): создаёт instance + первый шаг"
      tags: [workflows]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunWorkflowRequest' }
      responses:
