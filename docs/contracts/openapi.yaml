  # ---- sessions ----
  /api/v1/sessions:
    get:
      operationId: listSessions
      summary: Все сессии (фильтры team_id/role_id/state)
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/TeamIdQuery' }
        - { $ref: '#/components/parameters/RoleidQuery' }
        - { $ref: '#/components/parameters/State' }
      responses:
        '200':
          description: Сессии (SessionDetail)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionsListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createSession
      summary: Создать и запустить сессию роли
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/TeamIdQuery' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Сессия запущена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/compact-plan:
    get:
      operationId: getCompactPlan
      summary: Компактный план — сессии у контекст-стены
      description: >
        P1.5. Живые сессии с context_used_percentage >= порога (sessions.context_wall_pct,
        default 80), sort desc по %; без usage — omit. suggested_action: handover /
        wait_for_turn. Читаемый (RBAC sessions.read).
      tags: [sessions]
      responses:
        '200':
          description: Список сессий у контекст-стены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompactPlanResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  # ---- P1.8: Health/Doctor-панель (diagnostics, read-only) ----
  /api/v1/diagnostics:
    get:
      operationId: getDiagnostics
      summary: Health/Doctor — срез состояния (read-only)
      description: >
        P1.8. «The surface that shows the truth»: пер-чек'и (name, status ok|warn|fail,
        detail, evidence): daemon (up/version/uptime), database.ping, database.migrations
        (applied vs available), tmux.server, **sessions.divergence** (active в БД vs
        alive в адаптере — расхождение → fail), logs.dir (writable), git (read-only).
        Read-only (RBAC diagnostics.read, operator+).
      tags: [diagnostics]
      responses:
        '200':
          description: Срез диагностики
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/diagnostics/run:
    post:
      operationId: runDiagnostics
      summary: Health/Doctor — явный полный прогон (read-only)
      description: >
        P1.8. Принудительный полный прогон всех чек'ов (тот же результат, что GET
        /diagnostics). Read-only (RBAC diagnostics.read, operator+).
      tags: [diagnostics]
      responses:
        '200':
          description: Результат прогона
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DiagnosticsResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/sessions/search:
    get:
      operationId: searchSessionsTranscripts
      summary: Поиск по транскриптам сессий (P2.7)
      tags: [sessions]
      description: >-
        Наивный bounded-поиск (substring, case-insensitive) по transcript-файлам
        сессий. q — обязательный (min 2, иначе 400). Фильтры role_id/team_id/state
        сужают набор сканируемых файлов. Файл нет/нечитаем → сессия пропускается;
        q не найден → пустой список (не 404).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
        - { name: role_id, in: query, required: false, schema: { type: integer } }
        - { name: team_id, in: query, required: false, schema: { type: integer } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptSearchResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/sessions/{id}:
    get:
      operationId: getSession
      summary: Детали сессии (SessionDetail + live-метрики)
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Сессия
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: stopSession
      summary: Остановить сессию (идемпотентно; из failed → 409)
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Сессия остановлена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/sessions/{id}/handover:
    post:
      operationId: handoverSession
      summary: Продолжить сессию в новой (handover + компактный контекст-пакет)
      description: >
        P1.5. Сессия у контекст-стены → новая сессия той же роли с переданным
        контекстом. dry_run: план без мутаций; иначе полный прогон с честным
        per-step отчётом (context_prepared / successor_started / task_reassigned /
        old_stopped). Только живая сессия (из stopped/повторный → 409).
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoverRequest' }
      responses:
        '200':
          description: Результат handover (per-step отчёт + new_session_id)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoverResult' }
        '400': { $ref: '#/components/responses/ValidationFailed' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/sessions/{id}/history:
    get:
      operationId: getSessionHistory
      summary: История сессии
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: История сессии
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionHistoryResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/sessions/{id}/transcript:
    get:
      operationId: getTranscript
      summary: Транскрипт сессии (лог)
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Транскрипт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/sessions/{id}/capture:
    get:
      operationId: captureSession
      summary: Стл-кадр экрана сессии (P2.8)
      description: >
        Последние N строк «экрана» сессии как артефакт. tmux/pi → tmux
        capture-pane (реальный экран; мёртвый tmux → 409 с причиной). process →
        log-tail (у process нет экрана — лог; файла нет → 200 с пустыми lines).
        Read-only. Снимок сохраняется в файл (saved_path).
      tags: [sessions]
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - name: lines
          in: query
          description: Сколько последних строк (default 20, max 200 — clamp)
          schema: { type: integer, default: 20, maximum: 200 }
      responses:
        '200':
          description: Стл-кадр
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Экран недоступен (tmux не установлен / сессия мертва)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---- watchdog ----
