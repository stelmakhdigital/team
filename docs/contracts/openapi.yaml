        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendChatroomMessageRequest' }
      responses:
        '201':
          description: Сообщение доставлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendChatroomMessageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ---- workflows ----
  /api/v1/workflows:
    get:
      operationId: listWorkflows
      summary: Список workflows (фильтры team_id/state)
      tags: [workflows]
      parameters:
        - { $ref: '#/components/parameters/TeamIdQuery' }
        - { $ref: '#/components/parameters/State' }
      responses:
        '200':
          description: Список workflows
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowsListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      operationId: createWorkflow
      summary: Создать workflow (с блоками/связями; ссылки на блоки = индексы)
      tags: [workflows]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkflowRequest' }
      responses:
        '201':
          description: Workflow создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowCreatedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/workflows/{id}:
    get:
      operationId: getWorkflow
      summary: Workflow + блоки + связи
      tags: [workflows]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200':
          description: Workflow (workflow/blocks/connections)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetWorkflowResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      operationId: updateWorkflow
      summary: Переименовать workflow (name/description) — U3-rename
      tags: [workflows]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameRequest' }
      responses:
        '200':
          description: Workflow переименован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenameResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      operationId: deleteWorkflow
      summary: Удалить workflow + все блоки и связи (контракт 20 §2.8)
      tags: [workflows]
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
