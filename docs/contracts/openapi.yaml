  # ---- websocket ----
  /ws:
    get:
      operationId: websocket
      summary: WebSocket real-time (subscribe на каналы; auth через ?api_key=)
      description: |
        Upgrade до WebSocket. Клиент шлёт `{type: 'subscribe', channels: [...]}`;
        сервер шлёт события `task.created`, `task.state_changed`,
        `session.started`, `session.stopped`, `session.output`, `message.sent`,
        `alert.created`. Каналы: `team:{id}`, `task:{id}`, `session:{id}`,
        `dashboard`. Auth: `X-API-Key` не шлётся браузером — используется
        query-параметр `?api_key=` (permission `dashboard.read`).
      tags: [websocket]
      security: []
      responses:
        '101':
          description: WebSocket switched protocol

